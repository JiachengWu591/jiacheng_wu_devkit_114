# See claude code environment variables documents at https://code.claude.com/docs/en/settings
# [env]
# Tokens for GitHub/PyPI/Codecov/ReadTheDocs needed only for publishing.
# Uncomment and configure via home-secret-toml after initial development.
# GITHUB_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get your_github_token_field') }}"
# CODECOV_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get your_codecov_token_field') }}"
# READTHEDOCS_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get your_readthedocs_token_field') }}"
# UV_PUBLISH_TOKEN = "{{ exec(command='uvx --from home-secret-toml hst get pypi.accounts.sh.token') }}"
# ^ uv publish reads this env var directly (see `uv publish --help`), so the `publish` task
#   below never needs to interpolate a token into the command line itself (which would be
#   shell-syntax-dependent: `$VAR` on bash, `%VAR%` on cmd.exe, `$env:VAR` on PowerShell).

[tools]
python = "3.13"
uv = "latest"
claude = "latest"
pandoc = "3.9" # Use pandoc 3.9 - latest stable major version as of 2026-04

# === Tasks ===
# Python Environment Management
[tasks.venv-create]
description = "🐍 Create Python virtual environment using uv (creates .venv directory)"
run = "uv venv --allow-existing"

[tasks.venv-remove]
description = "🗑️ Remove Python virtual environment (deletes .venv directory)"
run = "python .mise/tasks/venv-remove.py"

# Dependency Management
[tasks.inst]
description = "💾 Install all Python dependencies using uv (syncs from pyproject.toml and uv.lock)"
depends = ["venv-create"]
run = "uv sync --all-extras"

[tasks.export]
description = "📋 Export Python dependencies to requirements*.txt files using uv (for legacy compatibility)"
run = """
uv export --format requirements-txt --no-dev --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements.txt
uv export --format requirements-txt --extra dev --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-dev.txt
uv export --format requirements-txt --extra test --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-test.txt
uv export --format requirements-txt --extra doc --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-doc.txt
uv export --format requirements-txt --extra mise --no-emit-project --no-hashes --no-annotate --no-emit-package pywin32 --no-emit-package colorama --no-emit-package tzdata | sed 's/ ; platform_machine ==.*or.*//' > requirements-mise.txt
"""

# Testing
[tasks.test]
description = "🧪 Run unit tests using pytest (scans test files automatically)"
run = "uv run pytest tests"
depends = ["inst"]

[tasks.cov]
description = "🧪📊 Run unit tests with code coverage using pytest (generates HTML report in htmlcov/)"
run = "uv run pytest tests -s --tb=native --cov=jiacheng_wu_devkit_114 --cov-report term-missing --cov-report html:htmlcov"
depends = ["inst"]

[tasks.view-cov]
description = "👀📊 Open code coverage HTML report in browser (requires 'cov' task to run first)"
run = "python .mise/tasks/view-cov.py"

# Documentation
[tasks.clean-docs-build]
description = "🧹 Remove the previously built Sphinx HTML output (docs/build/)"
run = "python .mise/tasks/clean-docs-build.py"

[tasks.build-doc]
description = "📚 Build Sphinx documentation using sphinx-build (generates HTML in docs/build/html/)"
# depends (not a multi-line run): mise wraps multi-line scripts in `cmd /s /c "..."` on
# Windows, and a literal newline inside that quoted string does NOT act as a command
# separator there (verified: only the first line ever runs) — every multi-step task in
# this file is therefore split into single-line tasks chained via `depends` instead.
depends = ["inst", "clean-docs-build"]
run = "uv run sphinx-build -b html docs/source docs/build/html"

[tasks.view-doc]
description = "👀📚 Open built Sphinx documentation in browser (requires 'build-doc' task to run first)"
run = "python .mise/tasks/view-doc.py"

[tasks.notebook-to-markdown]
description = "📓 Convert Jupyter notebooks to Markdown for AI knowledge base (processes .ipynb files)"
run = "uv run python .mise/tasks/notebook-to-markdown.py"
depends = ["inst"]

# Building & Publishing & Release
[tasks.build]
description = "🏗️ Build Python package wheel and source distribution using uv (outputs to dist/)"
# Single line, no embedded quotes: mise wraps multi-line scripts in `cmd /s /c "..."` on
# Windows, and an embedded `python -c "..."` there breaks cmd's quote nesting. `uv build`
# itself overwrites stale dist/ files fine, so a separate clean step isn't required.
run = "uv build"

[tasks.publish-precheck]
description = "📦 Print the PyPI URL this release will publish to (sanity check before uploading)"
depends = ["build"]
run = "uv run python .mise/tasks/publish.py"

[tasks.publish]
description = "🚀 Publish Python package to PyPI using uv (reads token from UV_PUBLISH_TOKEN env var)"
depends = ["publish-precheck"]
run = "uv publish"

[tasks.release]
description = "🏷 Create GitHub release using PyGithub (idempotent: skips if release exists)"
run = "uv run python .mise/tasks/release.py"
depends = ["inst"]

# CI/CD Setup
[tasks.setup-codecov]
description = "⚙️ Setup Codecov upload token on GitHub Actions secrets using PyGithub and httpx"
run = "uv run python .mise/tasks/setup-codecov.py"
depends = ["inst"]

[tasks.setup-readthedocs]
description = "⚙️ Setup ReadTheDocs project and GitHub webhook using httpx API client"
run = "uv run python .mise/tasks/setup-readthedocs.py"
depends = ["inst"]

[tasks.update-github-metadata]
description = "🔧 Update GitHub repository description and homepage using PyGithub"
run = "uv run python .mise/tasks/update-github-metadata.py"
depends = ["inst"]
